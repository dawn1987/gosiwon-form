<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>퇴실 신청서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F2F4F6;--surface:#fff;--ink:#191F28;--sub:#4E5968;--muted:#8B95A1;--line:#E5E8EB;--fill:#F2F4F6;--blue:#3182F6;--blue-soft:#E8F3FF;--red:#F04452;--red-soft:#FFEEEE;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.03em}
.lead{color:var(--sub);margin:0 0 20px}
.card{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:14px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:17px;margin:0;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:6px}
label.lb{font-size:13px;font-weight:600;color:var(--sub)}
.req::after{content:" *";color:var(--red)}
input[type=text],input[type=tel],input[type=date],textarea{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:13px 14px;width:100%;min-height:48px}
textarea{min-height:80px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.info dt{color:var(--muted)} .info dd{margin:0;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:9px 14px;border-radius:99px;background:var(--fill);color:var(--sub);font-weight:600;font-size:14px;cursor:pointer}
.chip input:checked + span{background:var(--blue);color:#fff}
.hint{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:#C25B00;background:#FFF3E0;border-radius:12px;padding:10px 12px}
.photo-box{border-radius:16px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;min-height:150px;cursor:pointer;font-weight:600;text-align:center;padding:16px;overflow:hidden}
.photo-box img{max-width:100%;max-height:260px;border-radius:10px;display:block}
.rules{display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--sub)}
.rules b{color:var(--ink);display:block;margin-bottom:2px;font-size:15px}
.rules ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--fill);border-radius:14px;cursor:pointer;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:1px 0 0}
details.more summary{font-size:13px;color:var(--blue);cursor:pointer;margin-top:4px}
details.more div{font-size:13px;color:var(--sub);margin-top:6px}
.sig-wrap{position:relative;background:var(--fill);border-radius:16px;overflow:hidden;touch-action:none}
canvas#sig{display:block;width:100%;height:170px}
.sig-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none;font-size:14px}
.btn{appearance:none;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:16px;min-height:52px;padding:12px 18px;cursor:pointer}
.btn.small{min-height:36px;font-size:13px;padding:6px 12px;background:var(--fill);color:var(--sub);align-self:flex-end;border-radius:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.bottom .btn{display:block;width:100%;max-width:528px;margin:0 auto;background:var(--blue);color:#fff}
.bottom .btn[disabled]{opacity:.5}
.err{color:var(--red);font-size:13px;font-weight:600}
.done{text-align:center;padding:60px 20px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:32px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--fill)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.ph-add{aspect-ratio:3/4;border-radius:14px;background:var(--blue-soft);color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:13px;cursor:pointer;text-align:center;padding:6px}
.ph-add b{font-size:24px;line-height:1}
select{font:inherit;color:var(--ink);background:var(--fill);border:0;border-radius:12px;padding:13px 14px;width:100%;min-height:48px}
.steps{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--sub)}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1 id="title">퇴실 신청서</h1>
  <p class="lead" id="lead">그동안 이용해 주셔서 감사합니다. 아래 내용을 올려 주시면 방 확인 후 7일 안에 보증금을 돌려드려요.</p>

  <div class="card" id="info" hidden><h2>퇴실 정보</h2><dl class="info" id="info-dl"></dl></div>

  <div class="card">
    <h2>진행 순서</h2>
    <div class="steps"><div><span>1</span>방 정리 후 짐을 모두 빼고 청소해 주세요</div><div><span>2</span>방 전체 사진과 화장실 사진, 환불 계좌를 올려 주세요</div><div><span>3</span>방 확인 후 7일 안에 보증금을 돌려드려요</div></div>
  </div>

  <div class="card">
    <h2>방 사진</h2>
    <span class="hint">방 전체가 보이게 1~4장 올려 주세요. (책상, 침대, 바닥, 수납장)</span>
    <div class="photo-grid" id="g-room"></div>
    <input type="file" id="f-room" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2>화장실 사진</h2>
    <span class="hint">1~2장 올려 주세요.</span>
    <div class="photo-grid" id="g-bath"></div>
    <input type="file" id="f-bath" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2>보증금 환불 계좌</h2>
    <div class="field"><label class="lb req" for="bank">은행</label>
      <select id="bank"><option value="">은행 선택</option>
      <option>신한은행</option><option>KB국민은행</option><option>우리은행</option><option>하나은행</option><option>NH농협은행</option><option>IBK기업은행</option><option>카카오뱅크</option><option>토스뱅크</option><option>케이뱅크</option><option>새마을금고</option><option>우체국</option><option>SC제일은행</option><option>수협은행</option><option>신협</option><option>부산은행</option><option>대구은행(iM뱅크)</option><option>경남은행</option><option>광주은행</option><option>전북은행</option><option>제주은행</option><option>씨티은행</option><option>기타</option></select></div>
    <div class="field"><label class="lb req" for="acct">계좌번호</label><input type="text" id="acct" inputmode="numeric" placeholder="- 없이 숫자만" autocomplete="off"></div>
    <div class="field"><label class="lb req" for="holder">예금주</label><input type="text" id="holder" autocomplete="name"></div>
    <span class="hint">본인 명의 계좌가 아니면 요청 사항에 이유를 적어 주세요.</span>
  </div>

  <div class="card">
    <h2>확인</h2>
    <label class="check"><input type="checkbox" id="c1"><span><b>짐을 모두 빼고 방 청소를 마쳤습니다.</b></span></label>
    <label class="check"><input type="checkbox" id="c2"><span><b>신발장 정리를 마쳤습니다.</b></span></label>
    <div class="field"><span class="lb req">파손된 곳이 있나요?</span>
      <div class="chips" role="radiogroup">
        <label class="chip"><input type="radio" name="damage" value="none"><span>파손 없음</span></label>
        <label class="chip"><input type="radio" name="damage" value="yes"><span>파손 있음</span></label>
      </div>
      <textarea id="damageNote" placeholder="어디가 어떻게 파손됐는지 적어 주세요. 가능하면 사진도 함께 올려 주세요." hidden></textarea>
    </div>
    <div class="field"><label class="lb" for="note">요청 사항 (선택)</label><textarea id="note" placeholder="불편했던 점이나 전할 말이 있으면 적어 주세요"></textarea></div>
    <div class="hp" aria-hidden="true"><label>비워두세요<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>
<div class="bottom" id="bottom"><button class="btn" id="submit" type="button">제출하기</button></div>

<script>
(function(){
"use strict";
const SB_URL = "https://brmjyqajazimkapsgwno.supabase.co";
const SB_KEY = "sb_publishable_JP82GzvBLZy0htkn56K7EA_dt2gK9ws";
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const P = { token:q.get("i")||"", room:q.get("r")||"", name:q.get("nm")||"", out:q.get("d")||"", house:q.get("n")||"" };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DONE_KEY = "gsw-out-" + (P.token||"open");
function doneScreen(name, again){
  document.getElementById("app").innerHTML = `<div class="done"><div class="ok">✓</div><h1>${again?"이미 제출했어요":"제출했어요"}</h1><p class="lead">${name?esc(name)+"님, ":""}퇴실 신청이 관리자에게 전달됐어요.<br>방 확인 후 7일 안에 보증금을 돌려드릴게요.<br>그동안 이용해 주셔서 감사합니다.</p></div>`;
  const b=document.getElementById("bottom"); if(b) b.remove(); window.scrollTo(0,0);
}
try{ const prev=JSON.parse(localStorage.getItem(DONE_KEY)||"null"); if(prev && P.token){ doneScreen(prev.name, true); return; } }catch(_){}
if(P.house){ $("#title").textContent = P.house + " 퇴실 신청서"; document.title = P.house + " 퇴실 신청서"; }
if(P.room||P.name||P.out){ $("#info").hidden=false; const d=P.out.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  $("#info-dl").innerHTML=(P.name?`<dt>이름</dt><dd>${esc(P.name)}님</dd>`:"")+(P.room?`<dt>호실</dt><dd>${esc(P.room)}호</dd>`:"")+(d?`<dt>퇴실일</dt><dd>${Number(d[2])}월 ${Number(d[3])}일</dd>`:""); }
if(P.name) $("#holder").value=P.name;

const groups={room:{max:4,min:1,items:[]}, bath:{max:2,min:1,items:[]}};
async function shrink(f){
  try{ const bmp=await createImageBitmap(f,{imageOrientation:"from-image"}); const max=1600, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82)); }catch(_){ return f.size<9.5*1024*1024?f:null; }
}
function draw(g){
  const G=groups[g]; const el=$("#g-"+g);
  el.innerHTML=G.items.map((it,i)=>`<div class="ph"><img src="${it.url}" alt=""><button type="button" data-g="${g}" data-i="${i}" aria-label="사진 빼기">×</button></div>`).join("")
    + (G.items.length<G.max?`<label class="ph-add" for="f-${g}"><b>＋</b>사진 추가<br>(${G.items.length}/${G.max})</label>`:"");
}
["room","bath"].forEach(g=>{
  draw(g);
  $("#f-"+g).addEventListener("change", async e=>{ const files=[...e.target.files]; e.target.value="";
    for(const f of files){ if(groups[g].items.length>=groups[g].max) break; const b=await shrink(f); if(b) groups[g].items.push({blob:b, url:URL.createObjectURL(b)}); }
    draw(g); });
  $("#g-"+g).addEventListener("click", e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; groups[g].items.splice(Number(b.dataset.i),1); draw(g); });
});
document.querySelectorAll("input[name=damage]").forEach(r=>r.addEventListener("change",()=>{ $("#damageNote").hidden = r.value!=="yes" || !r.checked; if(r.value==="none"&&r.checked) $("#damageNote").hidden=true; }));
$("#acct").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/[^\d-]/g,"").slice(0,24); });

function showErr(m){ $("#err").textContent=m; if(m) $("#err").scrollIntoView({behavior:"smooth",block:"center"}); }
function uuid(){ if(crypto.randomUUID) return crypto.randomUUID(); const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128; const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join(""); return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`; }
function headers(extra){ const h={apikey:SB_KEY, ...extra}; if(SB_KEY.startsWith("eyJ")) h.Authorization="Bearer "+SB_KEY; return h; }

$("#submit").addEventListener("click", async ()=>{
  showErr("");
  if(groups.room.items.length<1){ showErr("방 사진을 1장 이상 올려 주세요."); return; }
  if(groups.bath.items.length<1){ showErr("화장실 사진을 1장 이상 올려 주세요."); return; }
  const bank=$("#bank").value, acct=$("#acct").value.replace(/\D/g,""), holder=$("#holder").value.trim();
  if(!bank){ showErr("은행을 골라 주세요."); return; }
  if(acct.length<8){ showErr("계좌번호를 다시 확인해 주세요."); $("#acct").focus(); return; }
  if(!holder){ showErr("예금주를 입력해 주세요."); $("#holder").focus(); return; }
  if(!$("#c1").checked||!$("#c2").checked){ showErr("확인 항목을 모두 체크해 주세요."); return; }
  const damage=(document.querySelector("input[name=damage]:checked")||{}).value||"";
  if(!damage){ showErr("파손 여부를 골라 주세요."); return; }
  const damageNote=$("#damageNote").value.trim();
  if(damage==="yes" && !damageNote){ showErr("파손된 곳을 적어 주세요."); $("#damageNote").focus(); return; }
  if($("#website").value) return;
  if(SB_URL.startsWith("__")){ showErr("아직 준비 중인 신청서예요. 관리자에게 문의해 주세요."); return; }
  const btn=$("#submit"); btn.disabled=true; btn.textContent="올리는 중…";
  const id=uuid(); const files=[];
  try{
    let n=0;
    for(const g of ["room","bath"]) for(const it of groups[g].items){ n++; const name=`${g}${n}.jpg`;
      btn.textContent=`사진 올리는 중… (${files.length+1}/${groups.room.items.length+groups.bath.items.length})`;
      const r=await fetch(`${SB_URL}/storage/v1/object/apps/${id}/${name}`,{method:"POST",headers:headers({"Content-Type":"image/jpeg","x-upsert":"false"}),body:it.blob});
      if(!r.ok) throw new Error("upload "+r.status); files.push({name, kind:g}); }
    const data={kind:"checkout", name:P.name, room:P.room, moveOut:P.out, bank, account:acct, holder, note:$("#note").value.trim(), shoeDone:true, damage, damageNote, files, confirmedAt:new Date().toISOString()};
    const r=await fetch(`${SB_URL}/rest/v1/applications`,{method:"POST",headers:headers({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify({id, invite:P.token||null, room:P.room||null, data})});
    if(!r.ok) throw new Error("save "+r.status);
    try{ localStorage.setItem(DONE_KEY, JSON.stringify({name:P.name||holder, at:Date.now()})); }catch(_){}
    doneScreen(P.name||holder, false);
  }catch(err){ btn.disabled=false; btn.textContent="제출하기"; showErr("제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 계속 안 되면 관리자에게 문의해 주세요."); }
});
})();
</script>
</body>
</html>
